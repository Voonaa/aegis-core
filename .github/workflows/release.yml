name: Aegis Release Pipeline

# Triggered only on version tags (e.g., v1.0.1, v2.0.0)
# Responsibility: Package artifacts and publish GitHub Release.
# Lint, tests, and coverage are handled by ci.yml on every push/PR.
# Benchmarks must NOT run here (require physical hardware).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y
        $isccDir = Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty DirectoryName
        if ($isccDir) {
            Write-Host "Found ISCC.exe at: $isccDir"
            $isccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        } else {
            throw "ISCC.exe not found after Chocolatey install."
        }

    - name: Verify ISCC
      shell: pwsh
      run: Get-Command iscc

    - name: Install Python Dependencies
      run: pip install -r requirements.txt

    - name: Build Release Artifacts
      shell: pwsh
      run: .\scripts\build.ps1

    - name: Validate Release Artifacts
      shell: pwsh
      run: .\scripts\validator.ps1

    - name: Delete all existing releases for this tag (including drafts)
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $tag = "${{ github.ref_name }}"
        $repo = "${{ github.repository }}"
        $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
        }
        # List all releases and delete any that match our tag (published or draft)
        $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases?per_page=100" -Headers $headers
        $matched = $releases | Where-Object { $_.tag_name -eq $tag }
        if ($matched) {
            foreach ($rel in $matched) {
                Write-Host "Deleting release id=$($rel.id) draft=$($rel.draft) for tag $tag"
                Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" `
                    -Method Delete -Headers $headers
            }
            Write-Host "All existing releases for $tag deleted."
        } else {
            Write-Host "No existing releases found for $tag — proceeding."
        }

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          reports/release/AegisSetup.exe
          reports/release/AegisPortable.zip
          reports/release/checksums.sha256
          reports/release/release_notes.md
          reports/release/manifest.json
        body_path: reports/release/release_notes.md
        draft: false
        prerelease: true
        name: "Aegis Core Release ${{ github.ref_name }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

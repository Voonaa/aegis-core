name: Aegis Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y
        $isccDir = Get-ChildItem -Path "C:\Program Files*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty DirectoryName
        if ($isccDir) {
            Write-Host "Found ISCC.exe at: $isccDir"
            $isccDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        } else {
            throw "ISCC.exe not found on runner disk"
        }

    - name: Verify ISCC
      shell: pwsh
      run: |
        Get-Command iscc

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Pytest Suite
      run: |
        $env:PYTHONPATH = "."
        python -m pytest tests/ -v
      shell: pwsh

    - name: Run Build and Release Script
      run: |
        # Executing release script compiles portable directories and installer setup.exe via ISCC
        .\scripts\release.ps1
      shell: pwsh

    - name: Assemble Final Release Assets
      run: |
        # Verify all built release binaries and notes exist in reports/release
        $ReleaseDir = "reports/release"
        Get-ChildItem -Path $ReleaseDir
        
        if (-not (Test-Path "$ReleaseDir/AegisSetup.exe")) { throw "AegisSetup.exe is missing" }
        if (-not (Test-Path "$ReleaseDir/AegisPortable.zip")) { throw "AegisPortable.zip is missing" }
        if (-not (Test-Path "$ReleaseDir/checksums.sha256")) { throw "checksums.sha256 is missing" }
        if (-not (Test-Path "$ReleaseDir/release_notes.md")) { throw "release_notes.md is missing" }
        if (-not (Test-Path "$ReleaseDir/manifest.json")) { throw "manifest.json is missing" }
        if (-not (Test-Path "reports/coverage/coverage.xml")) { throw "coverage.xml is missing" }
        if (-not (Test-Path "reports/benchmark/benchmark.md")) { throw "benchmark.md is missing" }
        if (-not (Test-Path "reports/benchmark/benchmark.json")) { throw "benchmark.json is missing" }
      shell: pwsh

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          reports/release/AegisSetup.exe
          reports/release/AegisPortable.zip
          reports/release/checksums.sha256
          reports/release/release_notes.md
          reports/release/manifest.json
          reports/coverage/coverage.xml
          reports/benchmark/benchmark.md
          reports/benchmark/benchmark.json
        body_path: reports/release/release_notes.md
        draft: false
        prerelease: true
        name: Aegis Core Release ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

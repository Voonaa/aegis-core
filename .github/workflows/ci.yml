name: Aegis CI/CD Build Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Ruff Linter
      run: |
        ruff check packages/ apps/ --select E,F,W --ignore E501,W503
      continue-on-error: true

    - name: Run MyPy Static Type Checker
      run: |
        mypy packages/ --ignore-missing-imports --no-strict-optional --exclude "release/"
      continue-on-error: true

    - name: Run Test Suite (Pytest + Coverage)
      shell: pwsh
      run: |
        $env:PYTHONPATH = "."
        python -m pytest tests/ -v --tb=short `
          --cov=packages `
          --cov-report=term `
          --cov-report=xml:reports/coverage/coverage.xml `
          --cov-report=html:reports/coverage/htmlcov

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: aegis-coverage-report
        path: reports/coverage/
        if-no-files-found: error
